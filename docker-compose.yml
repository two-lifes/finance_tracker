# Local run: `docker compose up -d --build`. Subscriptions work only if SUBS_API_URL in .env
# is reachable from the container.
services:
  bot:
    build:
      context: .
      target: runtime
    env_file: .env
    environment:
      DB_PATH: /data/finance.db
    volumes:
      - ./data:/data
    restart: unless-stopped
